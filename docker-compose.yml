# ═══════════════════════════════════════════════════════════════════════════════
#                    KIRIKKALE OLİMPİYAT SPOR KULÜBÜ
#                         Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olimpiyat-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - olimpiyat-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend (Production Build)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: olimpiyat-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - olimpiyat-network

  # ─────────────────────────────────────────────────────────────────────────────
  # MongoDB (Local development - Production'da Atlas kullanılıyor)
  # ─────────────────────────────────────────────────────────────────────────────
  # mongodb:
  #   image: mongo:6
  #   container_name: olimpiyat-mongodb
  #   restart: unless-stopped
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=admin
  #     - MONGO_INITDB_ROOT_PASSWORD=olimpiyat2024
  #     - MONGO_INITDB_DATABASE=olimpiyat_yuzme
  #   volumes:
  #     - mongodb_data:/data/db
  #   ports:
  #     - "27017:27017"
  #   networks:
  #     - olimpiyat-network

networks:
  olimpiyat-network:
    driver: bridge

volumes:
  mongodb_data:
