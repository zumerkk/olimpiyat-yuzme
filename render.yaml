# ═══════════════════════════════════════════════════════════════════════════════
#                    KIRIKKALE OLİMPİYAT SPOR KULÜBÜ
#                         Render.com Blueprint v2.0
#                    Enterprise Configuration - Optimized for Cold Start
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-backend
    runtime: node
    plan: free
    rootDir: backend
    
    # Build Configuration
    buildCommand: npm ci --production
    startCommand: node server.js
    
    # Health Check - Kritik: Backend'in hazır olup olmadığını kontrol eder
    healthCheckPath: /api/ping
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: MONGODB_URI
        sync: false  # Render dashboard'dan elle girilmeli
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://olimpiyat-frontend.onrender.com

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend (Static Site)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-frontend
    runtime: static
    plan: free
    rootDir: frontend
    
    # Build Configuration
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    
    # Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Cache static assets
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Don't cache HTML
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    
    # SPA Routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Environment Variables
    envVars:
      - key: VITE_API_URL
        value: https://olimpiyat-backend.onrender.com/api
