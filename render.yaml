# ═══════════════════════════════════════════════════════════════════════════════
#                    KIRIKKALE OLİMPİYAT SPOR KULÜBÜ
#                         Render.com Blueprint v3.1
#                    Production Ready - Custom Domain Desteği
# ═══════════════════════════════════════════════════════════════════════════════
#
# NOT: Domain alındıktan sonra URL'leri güncellemeniz gerekecek!
# Şu an Render'ın otomatik sağladığı URL'ler kullanılıyor.
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-backend
    runtime: node
    plan: free
    rootDir: backend
    region: frankfurt  # Türkiye'ye yakın
    
    # Build Configuration
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    
    # Health Check - Backend uyanık tutmak için
    healthCheckPath: /api/ping
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      # MongoDB URI - Render Dashboard'dan girilmeli (Secret)
      - key: MONGODB_URI
        sync: false
      # JWT Secret - Otomatik güçlü değer oluştur
      - key: JWT_SECRET
        generateValue: true
      # CORS için Frontend URL (Render URL)
      # Domain alındıktan sonra: https://www.olimpiyatyuzme.com
      - key: FRONTEND_URL
        value: https://olimpiyat-frontend.onrender.com
      # Admin bilgileri
      - key: ADMIN_EMAIL
        value: admin@olimpiyatyuzme.com
      - key: ADMIN_PASSWORD
        sync: false
      # SMS Ayarları - Render Dashboard'dan girilmeli
      - key: SMS_ENABLED
        value: "true"
      - key: SMS_USERNAME
        sync: false
      - key: SMS_PASSWORD
        sync: false
      - key: SMS_SENDER
        value: "MURAT UCAR"
      - key: SMS_API_URL
        value: "https://www.bozkurtsms.com.tr/services/api.php?islem=sms"
      - key: AUTO_SMS_ENABLED
        value: "true"

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend (Static Site) - Her zaman ücretsiz
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-frontend
    runtime: static
    plan: free
    rootDir: frontend
    region: frankfurt
    
    # Build Configuration
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    
    # Security Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    
    # SPA Routing - Tüm route'ları index.html'e yönlendir
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Environment Variables
    # API URL - Domain alındıktan sonra güncelle
    envVars:
      - key: VITE_API_URL
        value: https://olimpiyat-backend.onrender.com/api

