# ═══════════════════════════════════════════════════════════════════════════════
#                    KIRIKKALE OLİMPİYAT SPOR KULÜBÜ
#                         Render.com Blueprint v3.0
#                    Production - olimpiyatyuzme.com
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-backend
    runtime: node
    plan: free  # Starter ($7/ay) veya üstü önerilir custom domain için
    rootDir: backend
    
    # Build Configuration
    buildCommand: npm ci --production
    startCommand: node server.js
    
    # Health Check
    healthCheckPath: /api/ping
    
    # Environment Variables
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512"
      - key: MONGODB_URI
        sync: false  # Render dashboard'dan girilecek
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.olimpiyatyuzme.com
      - key: ADMIN_EMAIL
        value: admin@olimpiyatyuzme.com

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend (Static Site)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: olimpiyat-frontend
    runtime: static
    plan: free  # Static site her zaman ücretsiz
    rootDir: frontend
    
    # Build Configuration
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    
    # Headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    
    # SPA Routing
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Environment Variables
    envVars:
      - key: VITE_API_URL
        value: https://api.olimpiyatyuzme.com/api

# ═══════════════════════════════════════════════════════════════════════════════
# CUSTOM DOMAIN YAPILANDIRMASI
# ═══════════════════════════════════════════════════════════════════════════════
#
# Render Dashboard'da yapılacaklar:
#
# 1. BACKEND için (api.olimpiyatyuzme.com):
#    - olimpiyat-backend > Settings > Custom Domains
#    - Add Custom Domain: api.olimpiyatyuzme.com
#    - DNS: CNAME api -> olimpiyat-backend.onrender.com
#
# 2. FRONTEND için (www.olimpiyatyuzme.com):
#    - olimpiyat-frontend > Settings > Custom Domains
#    - Add Custom Domain: www.olimpiyatyuzme.com
#    - Add Custom Domain: olimpiyatyuzme.com (redirect to www)
#    - DNS: CNAME www -> olimpiyat-frontend.onrender.com
#    - DNS: CNAME @ -> olimpiyat-frontend.onrender.com (veya A record)
#
# ═══════════════════════════════════════════════════════════════════════════════
