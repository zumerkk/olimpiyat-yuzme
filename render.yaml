# 🌐 CUSTOM DOMAIN EKLEME (Domain Alındıktan Sonra)
# ═══════════════════════════════════════════════════════════════════════════════
#
# ADIM 1: Domain Satın Al (Önerilen: Natro, İsimtescil, GoDaddy)
#
# ADIM 2: DNS Ayarları (Domain sağlayıcı panelinde):
#    | Tip    | İsim | Değer                               |
#    |--------|------|-------------------------------------|
#    | CNAME  | www  | olimpiyat-frontend.onrender.com     |
#    | CNAME  | api  | olimpiyat-backend.onrender.com      |
#    | A      | @    | Render IP (dashboard'dan al)        |
#
# ADIM 3: Render Dashboard'da Custom Domain Ekle:
#    - Backend: Settings > Custom Domains > api.olimpiyatyuzme.com
#    - Frontend: Settings > Custom Domains > www.olimpiyatyuzme.com
#    - Frontend: Settings > Custom Domains > olimpiyatyuzme.com (redirect)
#
# ADIM 4: Environment Variables Güncelle:
#    - Backend FRONTEND_URL: https://www.olimpiyatyuzme.com
#    - Frontend VITE_API_URL: https://api.olimpiyatyuzme.com/api
#    - Frontend'i yeniden deploy et (Settings > Deploy > Manual Deploy)
#
# ADIM 5: SSL Sertifikası (Otomatik):
#    - Render otomatik Let's Encrypt SSL sertifikası sağlar
#    - DNS yayıldıktan sonra (5-30 dk) otomatik aktif olur
