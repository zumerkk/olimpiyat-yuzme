# ═══════════════════════════════════════════════════════════════════════════════
#                    KIRIKKALE OLİMPİYAT SPOR KULÜBÜ
#                    Production Nginx Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# Bu dosyayı sunucuda /etc/nginx/sites-available/olimpiyat olarak kaydedin
# sudo ln -s /etc/nginx/sites-available/olimpiyat /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Upstream backend
upstream backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name olimpiyatyuzme.com www.olimpiyatyuzme.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://www.olimpiyatyuzme.com$request_uri;
    }
}

# Non-www -> www redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name olimpiyatyuzme.com;
    
    ssl_certificate /etc/letsencrypt/live/olimpiyatyuzme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olimpiyatyuzme.com/privkey.pem;
    
    return 301 https://www.olimpiyatyuzme.com$request_uri;
}

# Main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.olimpiyatyuzme.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/olimpiyatyuzme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olimpiyatyuzme.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript image/svg+xml;
    
    # Root directory - Frontend build
    root /var/www/olimpiyat/frontend/dist;
    index index.html;
    
    # API proxy
    location /api {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Login rate limiting (daha sıkı)
    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # SPA routing - tüm route'ları index.html'e yönlendir
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Uploads directory
    location /uploads {
        alias /var/www/olimpiyat/backend/uploads;
        expires 7d;
        add_header Cache-Control "public";
    }
}
